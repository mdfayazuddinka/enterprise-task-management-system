<div class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Create New Task</h3>
      <span class="close-btn" (click)="closeModal()">&times;</span>
    </div>
    <form class="task-form" [formGroup]="taskForm" (ngSubmit)="submitForm()">
      <div class="form-section">
        <div class="form-control">
          <label for="title">Task Title</label>
          <input type="text" id="title" class="task-title" formControlName="title" />
          <div *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched">
            <small class="error">Task title is required</small>
          </div>
        </div>

        <div class="form-control text-truncate">
          <label for="project">Project Name</label>
          <select id="project" formControlName="project">
            <option *ngFor="let project of projectsList" [value]="project.name">{{ project.name }}</option>
          </select>
          <div *ngIf="taskForm.get('project')?.invalid && taskForm.get('project')?.touched">
            <small class="error">Project is required</small>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-control">
          <label>Priority</label>
          <select formControlName="priority">
            <option *ngFor="let priority of projectPriority" [value]="priority">{{ priority }}</option>
          </select>
          <div *ngIf="taskForm.get('priority')?.invalid && taskForm.get('priority')?.touched">
            <small class="error">Priority is required</small>
          </div>
        </div>

        <div class="form-control">
          <label for="assignedTo">Assigned To</label>
          <select id="assignedTo" formControlName="assignedTo">
            <option *ngFor="let userName of usersList" [value]="userName">{{ userName }}</option>
          </select>
          <div *ngIf="taskForm.get('assignedTo')?.invalid && taskForm.get('assignedTo')?.touched">
            <small class="error">Assigned user is required</small>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-control">
          <label for="createdDate">Created Date</label>
          <input type="date" id="createdDate" formControlName="createdDate" />
          <div *ngIf="taskForm.get('createdDate')?.invalid && taskForm.get('createdDate')?.touched">
            <small class="error">Created date is required</small>
          </div>
        </div>

        <div class="form-control">
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" formControlName="dueDate" />
          <div *ngIf="taskForm.get('dueDate')?.invalid && taskForm.get('dueDate')?.touched">
            <small class="error">Due date is required</small>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-control">
          <label for="status">Status</label>
          <div class="radio-group">
            <label *ngFor="let status of projectStatuses">
              <input type="radio" [value]="status" formControlName="status" />
              <span class="radio-button-text">{{ status }}</span>
            </label>
          </div>
          <div *ngIf="taskForm.get('status')?.invalid && taskForm.get('status')?.touched">
            <small class="error">Status is required</small>
          </div>
        </div>
      </div>

      <div class="form-section full-width">
        <div class="form-control">
          <label for="description">Description</label>
          <textarea id="description" formControlName="description" rows="5"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn secondary" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="taskForm.invalid">Create</button>
      </div>
    </form>
  </div>
</div>
