<div class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Edit New Task</h3>
      <span class="close-btn" (click)="closeModal()">&times;</span>
    </div>
    <form class="task-form" [formGroup]="taskForm" (ngSubmit)="submitForm()">
      <div class="form-section">
        <div class="form-control">
          <label for="title">Task Title</label>
          <input type="text" id="title" class="task-title" formControlName="title" />
          <div *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched">
            <small class="error">Task title is required</small>
          </div>
        </div>

        <div class="form-control text-truncate">
          <label for="type">Type</label>
          <select id="type" formControlName="type">
            <option *ngFor="let type of taskTypes" [ngValue]="type">{{ type }}</option>
          </select>
          <div *ngIf="taskForm.get('type')?.invalid && taskForm.get('type')?.touched">
            <small class="error">Type is required</small>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-control">
          <label>Priority</label>
          <select formControlName="priority">
            <option value="">Select Priority</option>
            <option *ngFor="let priority of taskPriorities" [value]="priority">{{ priority }}</option>
          </select>
          <div *ngIf="taskForm.get('priority')?.invalid && taskForm.get('priority')?.touched">
            <small class="error">Priority is required</small>
          </div>
        </div>

        <div class="form-control">
          <label for="assignedTo">Assigned To</label>
          <select id="assignedTo" formControlName="assignedTo">
            <option value="">Select User</option>
            <option *ngFor="let userName of usersList" [value]="userName">{{ userName }}</option>
          </select>
          <div *ngIf="taskForm.get('assignedTo')?.invalid && taskForm.get('assignedTo')?.touched">
            <small class="error">Assigned user is required</small>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-control">
          <label for="status">Status</label>
          <div class="radio-group">
            <label *ngFor="let status of taskStatuses">
              <input type="radio" [value]="status" formControlName="status" />
              <span class="radio-button-text">{{ status }}</span>
            </label>
          </div>
          <div *ngIf="taskForm.get('status')?.invalid && taskForm.get('status')?.touched">
            <small class="error">Status is required</small>
          </div>
        </div>
      </div>

      <div class="form-section full-width">
        <div class="form-control">
          <label for="description">Description</label>
          <textarea id="description" formControlName="description" rows="5"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn secondary" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="taskForm.invalid">Update</button>
      </div>
    </form>
  </div>
</div>
