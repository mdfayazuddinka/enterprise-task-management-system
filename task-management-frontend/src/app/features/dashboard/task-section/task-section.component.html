<div class="task-section">
  <div class="section-header">
    <span class="badge" [ngClass]="color">{{ title }}</span>
  </div>

  <div class="task-card">
    <div class="task-header">
      <span>Name</span>
      <span>Assignee</span>
      <span>Created Date</span>
      <span>Due Date</span>
      <span>Priority</span>
    </div>

    <div class="task-row" *ngFor="let task of tasks">
      <span class="task-item">{{ task.title }}</span>
      <span class="task-item">{{ task.assignedTo }}</span>
      <span class="task-item">{{ task.createdDate | date:'dd/MM/yyyy' }}</span>
      <span class="task-item">{{ task.dueDate | date:'dd/MM/yyyy' }}</span>
      <span class="task-item priority" [ngClass]="task.priority.toLowerCase()">
        {{ task.priority }}
      </span>
      <app-action-menu [items]="taskMenuItems" 
                      (actionSelected)="handleTaskAction($event, task)">
      </app-action-menu>
    </div>

    <button class="add-task" [routerLink]="['/app', { outlets: { popup: ['add-task'] } }]">+ Add Task</button>
  </div>
</div>
